[project]
name = "duoquiz-docling-service"
version = "0.1.0"
description = "Internal PDF parsing, OCR, bounding-box extraction, and WebP rendering sidecar for DuoQuiz"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "boto3>=1.35.0",
  "docling>=2.15.0",
  "pdf2image>=1.17.0",
  "pypdf>=5.1.0",
  "Pillow>=11.0.0",
]

